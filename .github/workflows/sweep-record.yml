name: Sweep record

on:
  workflow_run:
    workflows: [Sweep record refresh]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    if: github.event_name == 'workflow_run' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      numbers: ${{ steps.prs.outputs.numbers }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numbers=$(python3 lib/sweep_ci.py --discover)
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    if: needs.discover.outputs.numbers != '[]'
    strategy:
      matrix:
        number: ${{ fromJSON(needs.discover.outputs.numbers) }}
    concurrency:
      group: sweep-record-${{ matrix.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and publish sweep-record
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.number }}
        run: python3 lib/sweep_ci.py "$PR_NUMBER"
