name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.select.outputs.macos }}
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        run: python3 scripts/ci/select-tests.py

  macos:
    name: Validate (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.macos != 'false') }}
    runs-on: macos-latest
    # The full macOS suite currently takes about 40 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: brew install shellcheck bats-core ripgrep parallel
      - uses: ./.github/actions/validate
        with:
          suites: ${{ needs.changes.outputs.suites || 'all pr-tabs hog balance workers audit units tripwire' }}

  ubuntu:
    name: Validate (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-deps-ubuntu.sh
      - uses: ./.github/actions/validate
        with:
          suites: ${{ needs.changes.outputs.suites || 'all pr-tabs hog balance workers audit units tripwire' }}
