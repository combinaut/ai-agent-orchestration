name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo macos=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(\.md|^LICENSE)$|^docs/'; then
            echo macos=true >>"$GITHUB_OUTPUT"
          else
            echo macos=false >>"$GITHUB_OUTPUT"
          fi

  macos:
    name: Validate (macos-latest)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: brew install shellcheck bats-core
      - uses: ./.github/actions/validate

  ubuntu:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/validate
