id = "combinaut.settings"
name = "Settings popup"
version = "1.0.0"
min_herdr_version = "0.9.0"
description = "Edits ~/.claude/orchestration.toml in a popup titled 'Settings'."
platforms = ["linux", "macos"]

[[panes]]
id = "view"
title = "Settings"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "-c", "exec python3 \"$HOME/.claude/coordinator/settings-view.py\" --popup"]

[[actions]]
id = "open"
title = "Settings: open the popup"
description = "Open the settings editor in a popup."
command = ["sh", "-c", "exec python3 \"$HOME/.claude/coordinator/settings-view.py\" --open-popup"]
